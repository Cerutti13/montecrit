# SRD 5.2.1 p.290, Goblin Boss. Numbers checked against the PDF text.
# "Two attacks, using Scimitar or Shortbow in any combination."
# Moved here unchanged at M3 step 6 (docs/design/m3.md 4.6): the hand-written stat block stands in
# for the Foundry record as replace: true, so its compiled template, every closure hash and every
# golden stay byte-identical (tools/import-srd/test/step6-monsters.test.ts).
# Coverage step 9+: Redirect Attack ("Trigger: A creature the goblin can see makes an attack roll
# against it. Response: The goblin chooses a Small or Medium ally within 5 feet of itself. The goblin
# and that ally swap places, and the ally becomes the target of the attack instead",
# srd-raw.txt:48831-48834; on the Goblin Boss, Foundry item mmRedirectAttack) in the declare-time
# window (sim/d20.ts declaredWindow). Nimble Escape's Hide stays unmodeled (Hide is out of M3).
replace: true
foundryPath: packs/_source/actors24/fey/goblin-boss.yml
kind: monster
id: srd:goblin-boss
name: Goblin Boss
source: SRD 5.2.1 p.290
fidelity: partial
size: small
cr: 1
pb: 2
ac: 17
hp: { average: 21, formula: 6d6 }
speed: { walk: 30 }
initiative: { mod: 2, score: 12 }
abilities: { str: 10, dex: 15, con: 10, int: 10, wis: 8, cha: 10 }
gear:
  - { name: Chain Shirt }
  - { name: Scimitar }
  - { name: Shield }
  - { name: Shortbow }
attacks:
  - id: scimitar
    name: Scimitar
    kind: melee
    toHit: 4
    reach: 5
    damage:
      - { roll: 1d6 + 2, type: slashing, avg: 5 }
      - { roll: 1d4, type: slashing, avg: 2, ifAdvantage: true }
  - id: shortbow
    name: Shortbow
    kind: ranged
    toHit: 4
    range: [80, 320]
    damage:
      - { roll: 1d6 + 2, type: piercing, avg: 5 }
      - { roll: 1d4, type: piercing, avg: 2, ifAdvantage: true }
multiattack:
  alternatives:
    - [{ count: 2, from: [scimitar, shortbow] }]
options:
  - { id: nimble-escape-disengage, name: Nimble Escape (Disengage), cost: bonus, core: 'core:disengage' }
reactions:
  - { id: redirect-attack, name: Redirect Attack, window: attackDeclared, swap: { range: 5, minSize: small, maxSize: medium } }
unimplemented:
  - 'Nimble Escape: the Hide option'
provenance:
  review: reviewed
  pdfPage: 290
