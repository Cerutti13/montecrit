# SRD 5.2.1 p.128-129, Entangle (srd-raw.txt:26542-26567), read by hand at coverage step 7.3.
# A 20-foot square within 90 feet; its ground is Difficult Terrain until the spell ends. "Each
# creature (other than you) in the area when you cast the spell" makes a STR save or is Restrained
# until the spell ends (26555-26562), so an appear hook only, and allies can be caught. "A Restrained
# creature can take an action to make a Strength (Athletics) check against your spell save DC"
# (26562-26565); a success ends only its Restrained, and the plants stay.
