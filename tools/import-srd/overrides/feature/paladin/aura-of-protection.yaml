effects:
  - id: aura
    name: Aura of Protection
    zone: { shape: emanation, size: 10, includesOrigin: true, offWhen: [incapacitated], affects: allies }
    mods:
      - { on: [d20.save], op: flat, value: 'max(@mod, 1)' }
passive: { effects: [aura] }
