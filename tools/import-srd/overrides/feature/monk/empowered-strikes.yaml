# damage with your Unarmed Strike, it can deal your choice of Force damage or its normal damage
# type." Mapped whole (C13): a passive unarmed damageType force stat, which the engine resolves to
# the type the target defends against least, the normal type on a tie (sim/stats.ts). Foundry's
# attack activity is replaced by it. Nothing else, so full.
