# M3 step 5b (docs/design/m3.md C8): a second class-built Fighter 5 for the mastery-sampler golden,
# carrying the four masteries test:sample-fighter-masteries doesn't (one Fighter 5 masters four
# kinds, the Fighter table's Weapon Mastery column). Synthetic test fixture built only from SRD
# 5.2.1 data:
#   - Warhammer (Push) and Mace (Sap): one-handed, both in hand at the start.
#   - Greataxe (Cleave) and Greatsword (Graze): Two-Handed and Heavy (STR 16 clears Heavy's 13),
#     sheathed; drawing one is an Attack action strike's equip once both hands are empty.
# Second Wind and Action Surge come from the class; Improved Critical from the Champion.
kind: character
id: test:sample-fighter-heavy
name: Sample Fighter (heavy weapons)
source: synthetic test fixture
rules: '2024'
classes:
  - { class: srd:fighter, level: 5, subclass: srd:champion }
species: srd:human
size: medium
background: srd:soldier
abilities: { str: 16, dex: 14, con: 14, int: 10, wis: 12, cha: 8 }
hp: average
picks:
  srd:fighter#skills: [acrobatics, perception]
  srd:fighter#fighting-style: [srd:defense]
  srd:fighter#weapon-mastery: [srd:greataxe, srd:greatsword, srd:warhammer, srd:mace]
  srd:fighter#asi-4: { asi: { str: 1, con: 1 } }
  srd:human#skillful: [insight]
  srd:human#versatile: [srd:skilled]
  srd:skilled#skills: [history, survival, stealth]
  srd:soldier#tools: [Gaming Set (Dice)]
equipment:
  armor: srd:chain-mail
  shield: false
  weapons: [srd:warhammer, srd:mace, srd:greataxe, srd:greatsword]
  hands: [warhammer, mace]
